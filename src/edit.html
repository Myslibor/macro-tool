<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="scripts/edit.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Macro editor</h1>
        <div class="row">
          <button type="submit" id="select_button">Button select</button>
          <button type="submit" id="time_button">Change time</button>
          <button type="submit" id="change_name_button">Change macro name</button>
          <button type="submit" id="select_keybind_name">Change keybind</button>
          <button type="submit" id="loop_button">Change loop</button>
          <button type="submit" id="add_brick">Add brick</button>
          <button type="submit" id="save_button">Save</button>
          
        </div>
        <div id="selected_informations">
          <p id="time_after_key"></p>
          <p id="selected_key"></p>
          <p id="macro_name"></p>
          <p id="macro_keybind"></p>
          <p id="has_loop"></p>
        </div>
        <div id="bricks">
        </div> 
      </main>
  </body>
</html>
